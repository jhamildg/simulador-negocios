<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Simulador de Negocios: decide, aprende, crece. Dirige un negocio durante 12 meses con cuentas del negocio y finanzas personales separadas.">
<meta name="theme-color" content="#FFC93C">
<title>Simulador de Negocios</title>
<link rel="icon" href="assets/icono.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}html{color-scheme:light;-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: barra de progreso arriba (año, nivel, decisión); a la izquierda el escenario donde se decide y se leen consecuencias; a la derecha el tablero de la empresa que se actualiza con cada decisión. */
:root{
  /* Identidad V4: luminosa. Turquesa como color principal, celeste/azul claro de apoyo, coral de acento,
     amarillo y naranja para resaltar y verde claro para lo positivo. Un solo tema claro (sin fondos oscuros). */
  --color-principal:#0A7894; --color-secundario:#246FB8; --color-acento:#FF6B5B;
  --fondo:#F5FAFD; --fondo-tarjeta:#FFFFFF; --texto:#1F2A37; --texto-secundario:#4B5B6B;
  --exito:#1F8551; --advertencia:#9A5800; --error:#C2392B; --borde:#DCE7EF; --sombra:0 4px 16px rgba(31,42,55,.08);
  --bg:var(--fondo); --surface:var(--fondo-tarjeta); --sunk:#EDF5F9; --ink:var(--texto); --ink2:var(--texto-secundario); --mute:#5F6F7E; --line:var(--borde);
  --accent:var(--color-principal); --accent-soft:#DDF4F7; --on-accent:#FFFFFF;
  --good:var(--exito); --bad:var(--error); --bad-soft:#FFE8E4; --warn:var(--advertencia); --warn-soft:#FFF2D4; --proj:#9ED8E6;
  --blue:var(--color-secundario); --blue-soft:#E2F0FC; --purple:#C25E00; --purple-soft:#FFEBDB; --gold:#A86E00; --gold-soft:#FFF5CC;
  --coral:#FF6B5B; --coral-soft:#FFE8E4; --amarillo:#FFC93C; --naranja:#FF9F43; --celeste:#4FB3E8; --turquesa:#2EC4B6; --verde-claro:#7BD389;
  --hud:#FFFFFF; --hud-ink:var(--texto); --hud-mute:#5F6F7E;
  --sky:#D6F1FF; --sky-bad:#E4E6EB; --ground:#C9EDB4; --ground-bad:#DCD7CC; --bld:#4FA8E0; --bld2:#FF9F43; --win:#FFE27A; --win-off:#C9D3DC; --door:#2C3E50; --sign:#FF6B5B; --on-sign:#FFFFFF; --person:#2C3E50;
  --sun:#FFC93C; --cloud:#9AA5B1; --cloud-l:#FFFFFF; --road:#B8C4CE; --road-l:#FFFFFF; --box:#E3A35E;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1220px;margin:0 auto;padding-inline:20px;padding-block:22px 56px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:17px;margin:0;letter-spacing:-.01em}
h3{font-family:var(--display);font-weight:700;font-size:clamp(19px,2.4vw,24px);line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:600}
.sub{color:var(--ink2);max-width:60ch}
.note{color:var(--mute);font-size:12.5px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink2);padding:6px 12px;border-radius:8px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tc{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}
.tc input{width:54px;font-family:var(--mono);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 6px;color:var(--ink);text-align:right}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.btn{background:var(--accent);border:1px solid var(--accent);color:var(--on-accent);font-weight:600;border-radius:10px;padding:11px 18px;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line);font-weight:500}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
/* inicio */
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.type{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.type b{font-family:var(--display);font-size:18px}
.type span{color:var(--ink2);font-size:13.5px}
.type dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;margin:4px 0 0;font-size:12.5px}
.type dt{color:var(--mute)} .type dd{margin:0;font-family:var(--mono);text-align:right}
.type[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);border-width:2px;padding:15px}
.setup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.setup label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2);min-width:0}
.setup input{font-family:var(--mono);font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);width:100%;min-width:0}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;font-size:13px;color:var(--ink2)}
.how div{background:var(--sunk);border-radius:10px;padding:10px 12px}
.how b{display:block;color:var(--ink);font-family:var(--display)}
/* barra de juego */
.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.lvl{display:flex;flex-direction:column;line-height:1.2}
.lvl b{font-family:var(--display);font-size:18px}
.years{display:flex;gap:6px}
.yr{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mute);text-align:center}
.yr i{display:block;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.yr i u{display:block;height:100%;background:var(--accent);transition:width .4s}
.yr.on{color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:18px;align-items:start}
.stage{display:flex;flex-direction:column;gap:14px;min-width:0;animation:in .35s ease}
@keyframes in{from{transform:translateY(6px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.stage{animation:none}.yr i u,.bars i{transition:none}}
.card{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.event{border-color:var(--warn)} .card.plain{border:1px solid var(--line)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--accent-soft);color:var(--ink)}
.tag.ev{background:var(--warn-soft)} .tag.gray{background:var(--sunk);color:var(--ink2)}
.impact{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px 14px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start}
.opts button b{font-family:var(--display);width:26px;height:26px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:13px}
.opts button:hover{border-color:var(--accent);background:var(--accent-soft)}
.opts small{display:block;color:var(--warn);font-size:12px;margin-top:2px}
.deltas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin:0;padding:0;list-style:none}
.deltas li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.deltas b{font-family:var(--mono);font-weight:500;white-space:nowrap}
.up{color:var(--good)} .down{color:var(--bad)} .neu{color:var(--ink2)}
.why{background:var(--sunk);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.why b{font-family:var(--display)}
.future{font-size:13px;color:var(--ink2);border-left:3px solid var(--line);padding-left:10px}
.verdict{border-radius:10px;padding:10px 14px;font-family:var(--display);font-size:17px;font-weight:700}
.verdict.up{background:var(--accent-soft);color:var(--ink)} .verdict.down{background:var(--bad-soft);color:var(--ink)} .verdict.neu{background:var(--sunk);color:var(--ink)}
.rep{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rep div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rep span{font-size:11.5px;color:var(--mute)} .rep b{font-family:var(--mono);font-weight:500;font-size:15px;overflow-wrap:anywhere} .rep em{font-style:normal;font-size:12px;font-family:var(--mono)}
ul.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;color:var(--ink2)}
/* tablero */
.dash{display:flex;flex-direction:column;gap:14px;min-width:0}
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.ring{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--v)*1%),var(--sunk) 0)}
.ring div{width:82px;height:82px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.05}
.ring b{font-family:var(--display);font-size:28px} .ring span{font-size:10px;color:var(--mute);display:block}
.bars{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.bars div{display:grid;grid-template-columns:84px minmax(0,1fr) 26px;gap:8px;align-items:center}
.bars span{color:var(--ink2)} .bars em{font-style:normal;font-family:var(--mono);text-align:right}
.bars s{display:block;height:7px;border-radius:4px;background:var(--sunk);overflow:hidden;text-decoration:none}
.bars i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s}
.bars i.low{background:var(--bad)} .bars i.mid{background:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.kpi .n{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:4px;align-items:center}
.kpi .v{font-family:var(--mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .d{font-family:var(--mono);font-size:11.5px;min-height:17px}
.kpi.alert{border-color:var(--bad);background:var(--bad-soft)}
.q{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink2);font-size:11px;line-height:1;padding:0;flex:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:20px;padding:3px 10px;font-size:12.5px;color:var(--ink2)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chart{position:relative}
.chart svg,.scene{display:block;width:100%;height:auto}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--mute)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;border-radius:8px;padding:6px 9px;white-space:nowrap;transform:translate(-50%,-115%);font-family:var(--mono)}
.meter{height:12px;background:var(--sunk);border-radius:6px;position:relative;margin:22px 0 6px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.meter i.short{background:var(--bad)}
.meter u{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.meter em{position:absolute;top:-21px;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--ink2);white-space:nowrap}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.tasks li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;align-items:center;color:var(--ink2)}
.tasks i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mute);font-style:normal;font-size:10px;line-height:12px;text-align:center;color:var(--on-accent)}
.tasks li.done{color:var(--ink)} .tasks li.done i{background:var(--accent);border-color:var(--accent)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;font-size:13px}
.tl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding-bottom:10px;position:relative}
.tl li:before{content:"";position:absolute;left:5px;top:12px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child:before{display:none}
.tl i{width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--mute)}
.tl i.up{background:var(--good)} .tl i.down{background:var(--bad)} .tl i.yr{background:var(--ink);border-radius:3px}
.tl span{color:var(--mute);font-size:11.5px;display:block}
.overlay{position:fixed;inset:0;background:rgba(10,20,18,.55);display:grid;place-items:center;padding:20px;z-index:10}
.modal{background:var(--surface);border-radius:16px;padding:22px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.end{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin:0}
.end div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.end b{font-family:var(--mono);font-weight:500}
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block}
.banner .big .ico{width:40px;height:40px;stroke-width:1.8;vertical-align:middle}
.b-blue .big{color:var(--blue)} .b-green .big{color:var(--good)} .b-red .big{color:var(--bad)} .b-yellow .big{color:var(--warn)} .b-gold .big{color:var(--gold)}
.opt-ic{color:var(--blue)} .opt-ic .ico{width:26px;height:26px}
.k-fin .ki{color:var(--good)} .k-mkt .ki{color:var(--blue)} .k-inn .ki{color:var(--purple)} .k-rsk .ki{color:var(--bad)}
.ki .ico{width:15px;height:15px;vertical-align:middle}
.deltas li span .ico,.rep span .ico,.end span .ico,.idgrid span .ico{color:var(--ink2);margin-right:2px}
.ach small{font-size:10px;font-weight:500;opacity:.75;margin-left:6px;text-transform:uppercase;letter-spacing:.05em}
.ach.on .ico{color:var(--gold)}
.pc{font-size:12.5px;color:var(--ink2);display:block} .pc b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.stylebox{background:var(--purple-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.stylebox .sty s{background:var(--surface)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn.alt{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.alts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.alts div{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--ink2)} .alts b{color:var(--ink);font-family:var(--display)}
@media (max-width:620px){.alts{grid-template-columns:minmax(0,1fr)}}
.acct{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hello{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg.nav button{padding:5px 10px;font-size:13px}
.saved{display:block;font-size:11px;color:var(--good);opacity:0;transition:opacity .3s;margin-top:2px} .saved.on{opacity:1}
.pill.i-blue{background:var(--blue-soft);color:var(--ink)} .pill.i-good{background:var(--accent-soft);color:var(--ink)} .pill.i-warn{background:var(--warn-soft);color:var(--ink)}
.glist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} .gcard{display:flex;flex-direction:column;gap:12px}
.two3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bars.wide div{grid-template-columns:minmax(0,190px) minmax(0,1fr) 30px}
.evo{display:flex;gap:6px;align-items:flex-end;height:110px;overflow-x:auto;padding-top:16px}
.evo div{flex:0 0 26px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.evo i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px} .evo span{font-size:10px;color:var(--mute)} .evo b{position:absolute;top:-14px;font-size:10px;font-family:var(--mono);font-weight:500}
.tbl{border-collapse:collapse;width:100%;font-size:13px} .tbl th,.tbl td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.scroll{overflow-x:auto}
@media (max-width:760px){.glist,.two3{grid-template-columns:minmax(0,1fr)}}
.btn.sm{padding:6px 12px;font-size:13.5px;align-self:center}
.guest{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-color:var(--blue);background:var(--blue-soft)}
.guest>div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 320px} .guest b{font-family:var(--display);font-size:16px} .guest span{color:var(--ink2);font-size:13.5px}
.authwrap{max-width:520px;margin:0 auto;width:100%}
.authform{display:flex;flex-direction:column;gap:12px}
.authform label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2)}
.authform input{font:inherit;font-size:15px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink);width:100%}
.authform .btn{align-self:stretch;text-align:center}
.pfbox .end{grid-template-columns:repeat(2,minmax(0,1fr))}
.pfme{border-color:var(--purple)}
.pfform{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.pfform label,.pfbudget label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);min-width:0}
.pfform input,.pfform select,.pfbudget input{font:inherit;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink);width:100%;min-width:0}
.pfbtns{margin:10px 0 6px}
.pfbudget{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}.pfbudget label{flex:1 1 180px}
.pfmov{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.pfmov li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}

.detsel select{font:inherit;color:var(--ink);padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:40px;max-width:100%}
.det-res{grid-template-columns:repeat(3,minmax(0,1fr))}
.ftbl tr.sub td{font-weight:700;background:var(--accent-soft)}
.ftbl tr.grp td{font-family:var(--body);font-weight:700;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding-top:12px}
.ftbl.cascada td:first-child{padding-left:10px}
.imp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px;display:flex;flex-direction:column;gap:6px}
.imp>b{font-size:14.5px}.imp .chip{align-self:flex-start}
.imp.nomod{background:var(--bg,#F5FAFD);border-style:dashed}
.imp dl{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:3px 10px;margin:0;font-size:13px}
.imp dt{color:var(--mute)}.imp dd{margin:0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.imp .note{margin:0}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2,#4B5B6B);margin:0 0 6px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}.sw.s1{background:var(--blue)}.sw.s2{background:var(--purple)}
.ftbl.evol{margin-top:10px}
.det .tip{white-space:normal;min-width:180px;text-align:left}
@media (max-width:620px){
 .det-res{grid-template-columns:repeat(2,minmax(0,1fr))}.det-res div:last-child:nth-child(odd){grid-column:1/-1}
 .bnav ul{padding:0 2px}.bnav button{font-size:10.5px;gap:2px}
 .bnav button[aria-current="page"] .ico{padding:2px 6px;width:36px}
 .imp dl{grid-template-columns:minmax(0,1fr)}.imp dt{margin-top:2px}
}
@media (max-width:380px){.bnav button span{font-size:10px}}
@media (max-width:900px){
 .ftbl.evol thead{display:none}
 .ftbl.evol tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px;border-bottom:1px solid var(--line);padding:6px 0}
 .ftbl.evol td{border:0;padding:1px 0;text-align:right;white-space:normal;display:flex;justify-content:space-between;gap:6px;font-size:12px}
 .ftbl.evol td::before{content:attr(data-l);font-family:var(--body);color:var(--mute);text-align:left}
 .ftbl.evol td:first-child{grid-column:1/-1;font-weight:700;font-family:var(--body);justify-content:flex-start}
}
.det .ftbl td:last-child{white-space:nowrap}
@media (max-width:480px){.ftbl.evol tr{grid-template-columns:minmax(0,1fr)}}

/* ===== SIM-1 (diseño de interfaz) + SIM-15 (celulares) =====
   Capa visual sobre V4/V5. Solo presentación: no cambia cálculos ni flujos.
   Colores con significado (se usan igual en todas las pantallas):
   ingresos = azul · costos y gastos = naranja · efectivo = turquesa · resultado = verde si gana, rojo si pierde. */
:root{
  --t-ing:var(--blue); --t-ing-soft:var(--blue-soft);
  --t-gas:var(--purple); --t-gas-soft:var(--purple-soft);
  --t-caja:var(--accent); --t-caja-soft:var(--accent-soft);
  --t-gan:var(--good); --t-gan-soft:#E1F6E8;
  --t-per:var(--bad); --t-per-soft:var(--bad-soft);
  --t-neu:#8A9AA9; --t-neu-soft:var(--sunk);
  --tap:44px; --radio:14px;
}

/* --- SIM-1 · Tipografía: ningún texto de lectura por debajo de 12 px --- */
.eyebrow,.hud-k,.tag,.tbl th,.pc b{font-size:12px}
.yr,.ring span,.ach small,.saved,.evo span,.evo b,.q,.meter em,.pfmov small{font-size:12px}
.rep span,.chips i,.kpi .d,.tl span,.mini span,.ftbl td small,.opts small,.opt small{font-size:12px}
.brand .wm span{font-size:11px;letter-spacing:.1em}
.note{font-size:13px;line-height:1.55}
.hud .mo{font-size:11px}

/* --- SIM-1 · Botones: misma forma, foco visible y respuesta al tocar --- */
.btn{border-radius:12px;line-height:1.2;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px}
.btn.ghost{border:1.5px solid var(--line);box-shadow:0 1px 0 var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.55;cursor:not-allowed;filter:none}
:where(button,a,select,input,summary,[tabindex]):focus-visible{outline:3px solid var(--celeste);outline-offset:2px}
.link{min-height:40px;padding:0 2px;border-radius:4px}
.seg button{min-height:40px;min-width:44px;padding:6px 12px}
.tabs{gap:6px}
.tabs button{min-height:40px;padding:6px 14px;font-size:13px}
.q{width:28px;height:28px;font-size:13px;font-weight:700;position:relative}
.q::after{content:"";position:absolute;inset:-8px}
details.more summary{min-height:44px}
.brand{min-height:44px}

/* --- SIM-1 · Tarjetas: menos bordes gruesos, color solo como acento --- */
.card{border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:16px}
.card.event{border-top-color:var(--bad)} .card.ev-good{border-top-color:var(--good)} .card.final{border-top-color:var(--gold)}
.card.plain{border-top:1px solid var(--line)}
.panel{border-radius:16px}
.head h2{display:flex;align-items:center;gap:8px}
.head h2 .ico{color:var(--accent)}
.banner{border-radius:14px}

/* --- SIM-1 · Indicadores del negocio (panel de la simulación) --- */
.mini{gap:8px}
.mini>div{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--t-neu);border-radius:12px;padding:9px 11px;gap:4px;justify-content:space-between}
.mini span{display:block;color:var(--ink2);font-size:12.5px;line-height:1.3}
.mini span .ico{width:16px;height:16px;margin-right:5px;vertical-align:-3px;color:var(--t-neu)}
.mini span em{font-style:normal;font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap}
.mini span em::before{content:" · "}
.mini b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.t-ing{--t-neu:var(--t-ing)} .t-gas{--t-neu:var(--t-gas)} .t-caja{--t-neu:var(--t-caja)} .t-gan{--t-neu:var(--t-gan)} .t-per{--t-neu:var(--t-per)}
.mini>.t-per b,.rsm .t-per b{color:var(--t-per)} .mini>.t-gan b,.rsm .t-gan b{color:var(--t-gan)}

/* --- SIM-1 · Resumen de dinero (Finanzas) y resumen del Detalle contable --- */
.rsm{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0}
.rsm>div{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--t-neu);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.rsm span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);line-height:1.25}
.rsm span .ico{width:16px;height:16px;color:var(--t-neu);flex:none}
.rsm b{font-family:var(--mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rsm small{font-size:12px;color:var(--mute);line-height:1.3}
.rsm-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.rep.det-res>div[class*="t-"]{box-shadow:inset 0 3px 0 var(--t-neu)}
.rep.det-res>div.t-per b{color:var(--t-per)}
.ftbl tr.tot td{background:var(--sunk)}
.ftbl tr:not(.tot):not(.sub):not(.grp):hover td{background:#F7FBFD}

/* --- SIM-1 · Opciones de decisión --- */
.opt{border-radius:var(--radio);gap:8px}
.opt-t{font-size:16px}
.opt:active{background:var(--blue-soft)}
@media (hover:none){.opt:hover{border-color:var(--line);box-shadow:0 1px 0 var(--line)}.pick:hover{border-color:var(--line);box-shadow:var(--sombra)}.btn:hover{filter:none}}

/* --- SIM-15 · Formularios cómodos de tocar --- */
.plan input[type=number],.setup input,.pfform input,.pfform select,.pfbudget input,.detsel select,.authform input,.tc input{min-height:40px}
.plan input[type=number]{font-family:var(--mono);font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--ink)}
.plan label{min-height:40px}
input[type=radio],input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}

/* --- SIM-15 · Ventanas (glosario) y avisos: siempre dentro de la pantalla --- */
.overlay{padding:16px;overscroll-behavior:contain}
.modal{max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;overscroll-behavior:contain}

/* --- Simulación en escritorio: el panel fijo solo si cabe entero en la pantalla --- */
.grid.sim .vis{position:static}
@media (min-width:961px) and (min-height:940px){.grid.sim .vis{position:sticky;top:10px}}

/* --- SIM-15 · Tabletas (761–960 px) --- */
@media (min-width:761px) and (max-width:960px){
 .fin{grid-template-columns:repeat(2,minmax(0,1fr))}
 .rsm{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (min-width:621px) and (max-width:960px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:960px){
 /* En una sola columna, la situación y sus opciones van primero; el panel del negocio, debajo */
 .grid.sim .stage{grid-row:1}
 .grid.sim .vis{grid-row:2}
}

/* --- SIM-15 · Celulares (≤ 760 px) --- */
@media (max-width:760px){
 :root{--nav-h:62px}
 .wrap{gap:14px}
 /* Encabezado compacto: marca y moneda arriba; cuenta debajo, a todo el ancho */
 .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center}
 .top .tools{display:contents}
 .top .brand{grid-column:1;grid-row:1;flex:none;min-width:0}
 .top .seg{grid-column:2;grid-row:1}
 .top #acct{grid-column:1/-1;grid-row:2;min-width:0}
 .top #acct:empty{display:none}
 .acct{gap:6px 10px}
 .acct>.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
 .acct .btn.sm{width:100%;white-space:nowrap;min-height:var(--tap);padding:8px 10px}
 .acct .seg.nav{flex:1 1 auto}
 .brand .wm{overflow:hidden}
 .brand .wm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 /* Barra del mes: mes, situación y salida en una fila; los 12 meses debajo */
 .hud{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"l r b" "m m m";gap:10px 12px;padding:12px 14px}
 .hud .hud-l{grid-area:l;min-width:0} .hud .hud-r{grid-area:r} .hud .months{grid-area:m;order:0}
 .hud .btn{grid-area:b;grid-column:auto;order:0;justify-self:end;align-self:center;min-height:var(--tap);padding:8px 12px;font-size:14px;white-space:nowrap}
 .hud b{font-size:19px}
 .hud .mo.on{font-size:12px}
 /* Títulos de situaciones más cortos de leer */
 .banner{gap:12px;padding:12px 14px}
 .banner .big .ico{width:32px;height:32px}
 .banner h3,.card h3{font-size:19px;line-height:1.3}
 .card{padding:16px;gap:12px}
 .panel{padding:16px}
 .opt{padding:12px 14px}
 .opt-ic{width:40px;height:40px} .opt-ic .ico{width:22px;height:22px}
 /* Indicadores y resúmenes */
 .rsm{grid-template-columns:repeat(2,minmax(0,1fr))}
 .rsm>div:last-child:nth-child(odd),.rep>div:last-child:nth-child(odd){grid-column:1/-1}
 .rsm b{font-size:17px}
 /* Formularios: 16 px evita el zoom automático del teclado en iPhone */
 input,select,textarea{font-size:16px!important}
 .plan input[type=number],.setup input,.pfform input,.pfform select,.pfbudget input,.detsel select,.authform input{min-height:var(--tap)}
 .plan .row{gap:10px 14px}
 .plan label{min-height:var(--tap)}
 .btn.sm{min-height:var(--tap)}
 .seg button,.tabs button{min-height:var(--tap)}
 .link{min-height:var(--tap)}
 .q{width:32px;height:32px}
 .q::after{inset:-6px}
 .detsel{flex-wrap:wrap}.detsel select{flex:1 1 200px}
 /* Ventana del glosario como hoja inferior, sin tapar la barra de secciones */
 .overlay{align-items:end;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
 .modal{max-width:none;border-radius:18px;padding:18px}
 /* Avisos encima de la barra inferior, no sobre ella */
 #toasts{bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px))}
 /* Barra inferior: etiquetas legibles */
 .bnav button{font-size:12px;letter-spacing:-.01em}
}
@media (max-width:420px){
 .brand img{width:34px;height:34px}
 .brand .wm b{font-size:16.5px}
 .top .seg button{padding:6px 10px;min-width:44px}
 .rep{grid-template-columns:repeat(2,minmax(0,1fr))}
 .mini b{font-size:16px}
}
@media (max-width:380px){
 /* Pantallas de 360 px: la marca ocupa su fila; la cuenta y la moneda comparten la segunda */
 .top{grid-template-columns:minmax(0,1fr) auto}
 .top .brand{grid-column:1/-1}
 .top #acct{grid-column:1;grid-row:2}
 .top .seg{grid-column:2;grid-row:2;align-self:start}
 .top #acct:empty~.seg{grid-column:1/-1;justify-self:end}
 .acct .btn.sm{padding:8px 6px;font-size:13.5px}
 .brand .wm b{font-size:18px}
 .bnav button,.bnav button span{font-size:11.5px}
 .hud .btn{padding:8px 10px}
}
/* Gráficos: el SVG mide 560 de ancho y se reduce en pantallas chicas; se agranda el texto para que se lea a ≥ 11 px reales */
@media (max-width:760px){.chart text{font-size:15px}}
@media (max-width:480px){.chart text{font-size:19px}}
/* Dispositivos táctiles: todo lo que se toca mide al menos 44 px */
@media (pointer:coarse){
 .btn,.btn.sm,.seg button,.tabs button,.link,.detsel select{min-height:var(--tap)}
}
@media (max-width:340px){.top #acct{grid-column:1/-1}.top .seg{grid-column:1/-1;grid-row:3;justify-self:end}.acct .btn.sm{padding:8px 10px}}

</style>
</head>

function styleMix() {
  const d = s.style, n = Object.values(d).reduce((a, b) => a + b, 0); if (!n) return null;

  <p class="note">Deuda promedio al final: ${money(avg(done, g => g.result.debt))}. Desde la V5, ventas y resultado son del año completo (12 meses); las partidas de versiones anteriores usaban el último año.</p></div>
  <div class="two3">${freq('Negocios elegidos', topN(G, g => bizName(g.biz)), G.length)}${freq('Finales', topN(done, g => g.result.final), done.length)}${freq('Estilos de dirección', topN(done, g => g.result.style), done.length)}${freq('Logros (usuarios que lo tienen)', ACH.map(a => [a.n, (A.achievements || {})[a.id] || 0]).sort((a, b) => b[1] - a[1]), U.length)}</div>
  <div class="panel"><div class="head"><h2>Qué eligen los jugadores</h2><span class="note">situaciones más vistas</span></div>${pk.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>Situación</th><th>Veces</th><th>A</th><th>B</th><th>C</th><th>D</th></tr></thead><tbody>${pk.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.n}</td>${['A', 'B', 'C', 'D'].map(o => `<td>${v[o] ? pct(v[o] / v.n) : '—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : '<p class="note">Todavía no hay decisiones registradas.</p>'}</div>
  <div class="panel"><div class="head"><h2>Usuarios</h2><span class="note">${U.length}</span></div><div class="scroll"><table class="tbl"><thead><tr><th>Nombre</th><th>Usuario</th><th>Correo</th><th>Registro</th><th>Partidas</th><th>Última actividad</th><th>Mejor índice</th><th>Estado</th><th></th></tr></thead><tbody>
  ${U.map(u => { const d = u.games.filter(g => g.result); return `<tr><td>${nm(u)}</td><td>${esc(u.username)}${u.role === 'ADMIN' ? ' (admin)' : ''}</td><td>${esc(u.email)}</td><td>${fdate(u.created)}</td><td>${u.games.length}</td><td>${fdt(u.last)}</td><td>${d.length ? nf(Math.max(...d.map(g => g.result.index)), 1) : '—'}</td><td>${new Date(u.last) > week ? 'Activo' : 'Inactivo'}</td><td>${u.games.length ? `<button class="link" data-pact="auser" data-k="${u.id}">Ver partidas</button>` : ''}</td></tr>` }).join('')}</tbody></table></div></div>
  ${A.sel ? `<div class="head" style="margin:0"><h2>Partidas de ${nm(U.find(u => u.id === A.sel))}</h2></div><div class="glist">${U.find(u => u.id === A.sel).games.map(g => gameCard(g, A.sel)).join('')}</div>` : ''}</div>`
}
function renderApp() {
  let html; const t = ui.tab;
  if (t === 'sim' && s) html = simHTML(); else if (t === 'fin' && s) html = finHTML(); else if (t === 'det' && s) html = detHTML(); else if (t === 'prog') html = progHTML(); else { ui.tab = 'inicio'; html = inicioHTML() }
  $('app').innerHTML = iconize(html);
  if (ui.tab === 'inicio') { const st = $('app').firstElementChild, c = ACC.me ? resumeCard() : (!ui.info ? guestCard() : ''); if (c && st) st.insertAdjacentHTML(ACC.me ? 'afterbegin' : 'beforeend', iconize(c)) }
  if (ui.tab === 'sim' && s) {
    if (ACC.canSave) { const h = document.querySelector('.hud-r'); if (h && !$('saved')) h.insertAdjacentHTML('beforeend', '<span id="saved" class="saved" aria-live="polite">Partida guardada</span>') }
    if (!ACC.me && s.phase === 'end') { const c = document.querySelector('#stage .card'); if (c) c.insertAdjacentHTML('beforebegin', iconize(saveCard())) }
  }
  if (ui.tab === 'fin' && s) chart();
  if (ui.tab === 'det' && s) detChart();
}
function render() {
  $('cur-bs').setAttribute('aria-pressed', CUR === 'Bs'); $('cur-usd').setAttribute('aria-pressed', CUR === 'USD');
  acctBar(); $('nav').innerHTML = iconize(navHTML());
  if (!ACC.ready) { $('app').innerHTML = '<div class="panel"><p class="note">Cargando…</p></div>'; return }
  if (!ACC.me && ['profile', 'games', 'detail', 'admin'].includes(ACC.view)) { ACC.view = 'auth'; ACC.auth.mode = 'login' }
  const v = ACC.view;
  if (v === 'app') { renderApp(); return }
  const html = v === 'auth' ? authHTML() : v === 'profile' ? profileHTML() : v === 'games' ? gamesHTML() : v === 'detail' ? detailHTML(ACC.detail.g, ACC.detail.back) : adminHTML();
  $('app').innerHTML = iconize(html)
}
async function openDetail(url, back) { ACC.detail = { g: null, back }; ACC.view = 'detail'; render(); window.scrollTo(0, 0); const r = await api('GET', url); if (r.ok) { ACC.detail.g = r.data.game; render() } else { ACC.view = back; render(); toast('<b>No se pudo abrir esa partida</b>' + esc(r.data.error || '')) } }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-pact]'); if (!t) return; const a = t.dataset.pact, k = t.dataset.k;
  if (a === 'auth') { ACC.auth = { mode: k, err: '', busy: false }; ACC.view = 'auth'; render(); window.scrollTo(0, 0); const i = document.querySelector('#authform input'); if (i) i.focus() }
  else if (a === 'logout') logout();
  else if (a === 'view') { if (k === 'admin') { ACC.view = 'admin'; loadAdmin(); return } if (k === 'home' || k === 'game') { ACC.view = 'app'; ui.tab = k === 'game' && s ? 'sim' : 'inicio' } else ACC.view = k; render(); window.scrollTo(0, 0) }
  else if (a === 'resume') resume(k);
  else if (a === 'detail') openDetail('/api/games/' + k, 'games');
  else if (a === 'auser') { ACC.admin.sel = k; render() }
  else if (a === 'adetail') openDetail('/api/admin/games/' + k.split('|')[1], 'admin')
});
document.addEventListener('submit', e => { if (e.target.matches && e.target.matches('form.authform')) { e.preventDefault(); submitAuth(e.target) } });
render(); boot();

</script>
</body>
</html>
