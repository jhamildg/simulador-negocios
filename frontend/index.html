<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Juego de gestión empresarial: dirige tu empresa durante cinco años y descubre qué tipo de director eres.">
<title>Simulador de Negocios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}html{color-scheme:light;-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: barra de progreso arriba (año, nivel, decisión); a la izquierda el escenario donde se decide y se leen consecuencias; a la derecha el tablero de la empresa que se actualiza con cada decisión. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E7ECEA; --ink:#13201D; --ink2:#4A5A56; --mute:#7C8A86; --line:#D5DDDA;
  --accent:#0B6E5B; --accent-soft:#D9EDE7; --on-accent:#FFFFFF;
  --good:#0B6E5B; --bad:#B83A3A; --bad-soft:#F6DFDD; --warn:#9A6B0F; --warn-soft:#F5E8CB; --proj:#9CCFC3; --blue:#2457C5; --blue-soft:#DCE7FB; --purple:#6B3FB8; --purple-soft:#E9E0F8; --gold:#B8860B; --gold-soft:#F8ECC4; --hud:#0F2A3A; --hud-ink:#EAF3F7; --hud-mute:#9DB6C2; --sky:#CFE6F7; --sky-bad:#D8D0D6; --ground:#9BC7A4; --ground-bad:#B5B0A2; --bld:#2F5FA8; --bld2:#6B3FB8; --win:#FFE08A; --win-off:#7C8FB0; --door:#1B2F4A; --sign:#0B6E5B; --on-sign:#FFFFFF; --person:#33454F; --sun:#F2B62E; --cloud:#6E6A78; --cloud-l:#FFFFFF; --road:#5B6670; --road-l:#D9DEE2; --box:#C99A5B;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1614; --surface:#16211E; --sunk:#1E2B28; --ink:#E8EFEC; --ink2:#B0BFBA; --mute:#82918C; --line:#2B3A36;
  --accent:#3FC2A4; --accent-soft:#173A33; --on-accent:#06231D;
  --good:#3FC2A4; --bad:#F0837C; --bad-soft:#40201E; --warn:#E3B45A; --warn-soft:#3A2E14; --proj:#27705F; --blue:#7FA8F5; --blue-soft:#1A2B4D; --purple:#B79AF0; --purple-soft:#2C2147; --gold:#E3B45A; --gold-soft:#3A2E14; --hud:#0A1C27; --hud-ink:#EAF3F7; --hud-mute:#8FA9B5; --sky:#1B3145; --sky-bad:#2E2A33; --ground:#254A36; --ground-bad:#3A372F; --bld:#4E7FCC; --bld2:#8C66D6; --win:#FFD86B; --win-off:#33456A; --door:#0B1622; --sign:#3FC2A4; --on-sign:#06231D; --person:#C9D6DC; --sun:#F2C14E; --cloud:#8C8798; --cloud-l:#33506B; --road:#1C2429; --road-l:#55626B; --box:#A87B45; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#16211E; --sunk:#1E2B28; --ink:#E8EFEC; --ink2:#B0BFBA; --mute:#82918C; --line:#2B3A36;
  --accent:#3FC2A4; --accent-soft:#173A33; --on-accent:#06231D;
  --good:#3FC2A4; --bad:#F0837C; --bad-soft:#40201E; --warn:#E3B45A; --warn-soft:#3A2E14; --proj:#27705F; --blue:#7FA8F5; --blue-soft:#1A2B4D; --purple:#B79AF0; --purple-soft:#2C2147; --gold:#E3B45A; --gold-soft:#3A2E14; --hud:#0A1C27; --hud-ink:#EAF3F7; --hud-mute:#8FA9B5; --sky:#1B3145; --sky-bad:#2E2A33; --ground:#254A36; --ground-bad:#3A372F; --bld:#4E7FCC; --bld2:#8C66D6; --win:#FFD86B; --win-off:#33456A; --door:#0B1622; --sign:#3FC2A4; --on-sign:#06231D; --person:#C9D6DC; --sun:#F2C14E; --cloud:#8C8798; --cloud-l:#33506B; --road:#1C2429; --road-l:#55626B; --box:#A87B45; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1220px;margin:0 auto;padding-inline:20px;padding-block:22px 56px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:17px;margin:0;letter-spacing:-.01em}
h3{font-family:var(--display);font-weight:700;font-size:clamp(19px,2.4vw,24px);line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:600}
.sub{color:var(--ink2);max-width:60ch}
.note{color:var(--mute);font-size:12.5px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink2);padding:6px 12px;border-radius:8px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tc{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}
.tc input{width:54px;font-family:var(--mono);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 6px;color:var(--ink);text-align:right}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.btn{background:var(--accent);border:1px solid var(--accent);color:var(--on-accent);font-weight:600;border-radius:10px;padding:11px 18px;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line);font-weight:500}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
/* inicio */
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.type{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.type b{font-family:var(--display);font-size:18px}
.type span{color:var(--ink2);font-size:13.5px}
.type dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;margin:4px 0 0;font-size:12.5px}
.type dt{color:var(--mute)} .type dd{margin:0;font-family:var(--mono);text-align:right}
.type[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);border-width:2px;padding:15px}
.setup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.setup label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2);min-width:0}
.setup input{font-family:var(--mono);font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);width:100%;min-width:0}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;font-size:13px;color:var(--ink2)}
.how div{background:var(--sunk);border-radius:10px;padding:10px 12px}
.how b{display:block;color:var(--ink);font-family:var(--display)}
/* barra de juego */
.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.lvl{display:flex;flex-direction:column;line-height:1.2}
.lvl b{font-family:var(--display);font-size:18px}
.years{display:flex;gap:6px}
.yr{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mute);text-align:center}
.yr i{display:block;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.yr i u{display:block;height:100%;background:var(--accent);transition:width .4s}
.yr.on{color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:18px;align-items:start}
.stage{display:flex;flex-direction:column;gap:14px;min-width:0;animation:in .35s ease}
@keyframes in{from{transform:translateY(6px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.stage{animation:none}.yr i u,.bars i{transition:none}}
.card{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.event{border-color:var(--warn)} .card.plain{border:1px solid var(--line)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--accent-soft);color:var(--ink)}
.tag.ev{background:var(--warn-soft)} .tag.gray{background:var(--sunk);color:var(--ink2)}
.impact{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px 14px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start}
.opts button b{font-family:var(--display);width:26px;height:26px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:13px}
.opts button:hover{border-color:var(--accent);background:var(--accent-soft)}
.opts small{display:block;color:var(--warn);font-size:12px;margin-top:2px}
.deltas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin:0;padding:0;list-style:none}
.deltas li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.deltas b{font-family:var(--mono);font-weight:500;white-space:nowrap}
.up{color:var(--good)} .down{color:var(--bad)} .neu{color:var(--ink2)}
.why{background:var(--sunk);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.why b{font-family:var(--display)}
.future{font-size:13px;color:var(--ink2);border-left:3px solid var(--line);padding-left:10px}
.verdict{border-radius:10px;padding:10px 14px;font-family:var(--display);font-size:17px;font-weight:700}
.verdict.up{background:var(--accent-soft);color:var(--ink)} .verdict.down{background:var(--bad-soft);color:var(--ink)} .verdict.neu{background:var(--sunk);color:var(--ink)}
.rep{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rep div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rep span{font-size:11.5px;color:var(--mute)} .rep b{font-family:var(--mono);font-weight:500;font-size:15px;overflow-wrap:anywhere} .rep em{font-style:normal;font-size:12px;font-family:var(--mono)}
ul.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;color:var(--ink2)}
/* tablero */
.dash{display:flex;flex-direction:column;gap:14px;min-width:0}
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.ring{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--v)*1%),var(--sunk) 0)}
.ring div{width:82px;height:82px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.05}
.ring b{font-family:var(--display);font-size:28px} .ring span{font-size:10px;color:var(--mute);display:block}
.bars{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.bars div{display:grid;grid-template-columns:84px minmax(0,1fr) 26px;gap:8px;align-items:center}
.bars span{color:var(--ink2)} .bars em{font-style:normal;font-family:var(--mono);text-align:right}
.bars s{display:block;height:7px;border-radius:4px;background:var(--sunk);overflow:hidden;text-decoration:none}
.bars i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s}
.bars i.low{background:var(--bad)} .bars i.mid{background:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.kpi .n{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:4px;align-items:center}
.kpi .v{font-family:var(--mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .d{font-family:var(--mono);font-size:11.5px;min-height:17px}
.kpi.alert{border-color:var(--bad);background:var(--bad-soft)}
.q{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink2);font-size:11px;line-height:1;padding:0;flex:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:20px;padding:3px 10px;font-size:12.5px;color:var(--ink2)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chart{position:relative}
.chart svg,.scene{display:block;width:100%;height:auto}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--mute)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;border-radius:8px;padding:6px 9px;white-space:nowrap;transform:translate(-50%,-115%);font-family:var(--mono)}
.meter{height:12px;background:var(--sunk);border-radius:6px;position:relative;margin:22px 0 6px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.meter i.short{background:var(--bad)}
.meter u{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.meter em{position:absolute;top:-21px;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--ink2);white-space:nowrap}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.tasks li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;align-items:center;color:var(--ink2)}
.tasks i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mute);font-style:normal;font-size:10px;line-height:12px;text-align:center;color:var(--on-accent)}
.tasks li.done{color:var(--ink)} .tasks li.done i{background:var(--accent);border-color:var(--accent)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;font-size:13px}
.tl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding-bottom:10px;position:relative}
.tl li:before{content:"";position:absolute;left:5px;top:12px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child:before{display:none}
.tl i{width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--mute)}
.tl i.up{background:var(--good)} .tl i.down{background:var(--bad)} .tl i.yr{background:var(--ink);border-radius:3px}
.tl span{color:var(--mute);font-size:11.5px;display:block}
.overlay{position:fixed;inset:0;background:rgba(10,20,18,.55);display:grid;place-items:center;padding:20px;z-index:10}
.modal{background:var(--surface);border-radius:16px;padding:22px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.end{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin:0}
.end div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.end b{font-family:var(--mono);font-weight:500}
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block}
.banner .big .ico{width:40px;height:40px;stroke-width:1.8;vertical-align:middle}
.b-blue .big{color:var(--blue)} .b-green .big{color:var(--good)} .b-red .big{color:var(--bad)} .b-yellow .big{color:var(--warn)} .b-gold .big{color:var(--gold)}
.opt-ic{color:var(--blue)} .opt-ic .ico{width:26px;height:26px}
.k-fin .ki{color:var(--good)} .k-mkt .ki{color:var(--blue)} .k-inn .ki{color:var(--purple)} .k-rsk .ki{color:var(--bad)}
.ki .ico{width:15px;height:15px;vertical-align:middle}
.deltas li span .ico,.rep span .ico,.end span .ico,.idgrid span .ico{color:var(--ink2);margin-right:2px}
.ach small{font-size:10px;font-weight:500;opacity:.75;margin-left:6px;text-transform:uppercase;letter-spacing:.05em}
.ach.on .ico{color:var(--gold)}
.pc{font-size:12.5px;color:var(--ink2);display:block} .pc b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.stylebox{background:var(--purple-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.stylebox .sty s{background:var(--surface)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn.alt{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.alts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.alts div{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--ink2)} .alts b{color:var(--ink);font-family:var(--display)}
@media (max-width:620px){.alts{grid-template-columns:minmax(0,1fr)}}
.acct{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hello{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg.nav button{padding:5px 10px;font-size:13px}
.saved{display:block;font-size:11px;color:#3FC2A4;opacity:0;transition:opacity .3s;margin-top:2px} .saved.on{opacity:1}
.pill.i-blue{background:var(--blue-soft);color:var(--ink)} .pill.i-good{background:var(--accent-soft);color:var(--ink)} .pill.i-warn{background:var(--warn-soft);color:var(--ink)}
.glist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} .gcard{display:flex;flex-direction:column;gap:12px}
.two3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bars.wide div{grid-template-columns:minmax(0,190px) minmax(0,1fr) 30px}
.evo{display:flex;gap:6px;align-items:flex-end;height:110px;overflow-x:auto;padding-top:16px}
.evo div{flex:0 0 26px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.evo i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px} .evo span{font-size:10px;color:var(--mute)} .evo b{position:absolute;top:-14px;font-size:10px;font-family:var(--mono);font-weight:500}
.tbl{border-collapse:collapse;width:100%;font-size:13px} .tbl th,.tbl td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.scroll{overflow-x:auto}
@media (max-width:760px){.glist,.two3{grid-template-columns:minmax(0,1fr)}}
.btn.sm{padding:6px 12px;font-size:13.5px;align-self:center}
.guest{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-color:var(--blue);background:var(--blue-soft)}
.guest>div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 320px} .guest b{font-family:var(--display);font-size:16px} .guest span{color:var(--ink2);font-size:13.5px}
.authwrap{max-width:520px;margin:0 auto;width:100%}
.authform{display:flex;flex-direction:column;gap:12px}
.authform label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2)}
.authform input{font:inherit;font-size:15px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink);width:100%}
.authform .btn{align-self:stretch;text-align:center}
/* ===== capa de juego ===== */

/* ===== motor ===== */
let s=null,ui={biz:'delivery',metric:'sales',setup:{}};
function proj(s,noise=0){
  // crecimiento de clientes: impulso comercial + reputación + satisfacción (retención) + innovación; se frena al saturar el mercado
  const P=(BIZ[s.biz]||{}).p||{};
  const gE=s.g>0?s.g/(1+1.5*s.g):s.g; // el impulso comercial tiene rendimientos decrecientes
  let growth=.03+(P.g0||0)+gE+(s.rep-50)*.003*(P.repK||1)+(s.sat-50)*.003+Math.max(-.02,((s.inno||30)-30)*.001*(P.innoK||1))+noise
    -((s.idle||0)>=2?.025:0)-(s.price0?Math.max(0,s.price/s.price0-1)*.4*(P.priceK||1):0); // cobrar más caro que al inicio frena la llegada de clientes nuevos
  if(growth>0&&s.M)growth*=Math.max(0,1-s.cust/s.M*(P.sat||1.6));
  // capacidad efectiva: instalaciones y personal (el menor de los dos), ajustada por productividad
  const staff=s.upe?s.emp*s.upe:Infinity,capE=Math.min(s.cap,staff)*(.75+s.prod/200);
  const cust=Math.max(0,s.cust*(1+growth)),demand=cust*s.freq,units=Math.min(demand,capE);
  const sales=units*s.price,varc=units*s.vc*(1-(s.prod-50)/400-Math.max(0,(s.inno||0)-30)/230*(P.innoK||1)), // productividad e innovación bajan el costo de operar
     // un equipo más productivo desperdicia menos
    rd=sales*(s.inno||0)/100*.07,fix=s.fixedO+s.emp*s.sal+rd,lev=s.debt/Math.max(sales,1),int=s.debt*(s.rate+Math.max(0,lev-.3)*.3); // a más apalancamiento, más caro el crédito // rd: sostener la innovación cuesta cada año
  const ebt=sales-varc-fix-int,tax=ebt>0?ebt*.25:0;
  return {rd,cust,demand,capE,units,staffShort:staff<s.cap*.98,lost:demand-units,sales,varc,fix,int,tax,profit:ebt-tax,be:s.price>s.vc?(fix+int)/(s.price-s.vc):Infinity};
}
function months(s){const p=proj(s);return s.cash/Math.max(1,(p.varc+p.fix)/12)}
function met(s){
  const p=proj(s),share=p.cust/s.M,dr=s.debt/Math.max(p.sales,1),m=s.cash/Math.max(1,(p.varc+p.fix)/12);
  const risk=clamp(Math.min(60,dr*75)+(m<1?25:m<2?15:m<3?8:0)+(p.profit<0?15:0)+(s.rep<35?8:0)+(s.cash<0?10:0)+(s.inno>55&&m<3?8:0));
  const idleCash=(s.idle||0)>=2?Math.max(0,s.cash-(p.varc+p.fix)/2)*.6:0; // la caja ociosa por años vale menos para un comprador
  const value=Math.max(0,p.profit*3.5+p.sales*.65+s.cash-idleCash-s.debt)*(1+(s.rep-50)/200+s.inno/120)*(1-Math.min(.2,Math.max(0,(s.stag||0)-1)*.07))*(s.own||1);
  const margin=p.sales?p.profit/p.sales:0;

function snap(s){const m=met(s);return {cash:s.cash,debt:s.debt,cust:s.cust,price:s.price,vc:s.vc,fix:m.fix,cap:s.cap,emp:s.emp,rep:s.rep,sat:s.sat,prod:s.prod,inno:s.inno,sales:m.sales,profit:m.profit,risk:m.risk,value:m.value,share:m.share,index:m.index,custP:m.cust}}

function buildYear(){

  const pool=shuffle(D.filter(d=>!d.when&&free(d)&&d.lv===L)).concat(shuffle(D.filter(d=>!d.when&&free(d)&&d.lv<L)));
  q=q.concat(pool).slice(0,4);
  const rk=met(s).risk,mg0=met(s).margin,W=e=>e.w(s)*(e.id==='competidor'?(mg0>.18?2.2:1)*(1+(s.stag||0)*.6):1)*((e.id==='remate'||e.id==='boom')&&(s.stag||0)>=2?.5:1)*(BIZ[s.biz].p.ev[e.id]||1)*(e.good?Math.max(.4,1.5-rk/60):.6+rk/50); // más riesgo: más probables los eventos negativos
  const evs=EV.filter(free);let tot=evs.reduce((a,e)=>a+W(e),0),r=rnd()*tot,ev=evs[0];

function eff(o){ // efecto real de una opción según el estado actual de la empresa

    if(e.prod>0){le.prod=e.prod;delete e.prod} // y la mejora de productividad también tarda
    if(e.cash<0)e.cash*=1+s.inno/200; // cada salto de innovación cuesta más que el anterior

// riesgo de ejecución de los proyectos de innovación: sube cuanto más innovas, con poca caja y con baja productividad

const ROWS=[['cash','💰 Dinero disponible','m',1],['debt','💳 Deuda','m',-1],['cust','👥 Clientes','n',1],['price','🏷️ Precio','p',0],['vc','📦 Costo por unidad','p',-1],['fix','🧾 Gastos fijos al año','m',-1],

function closeYear(){

 {id:'finanzas',g:'Medio',ic:'💰',n:'Maestro de las finanzas',d:'Cinco años seguidos con utilidad, caja para 6 semanas o más, deuda moderada y sin créditos de emergencia',t:(s,m,h)=>h&&h.y>=5&&s.fin&&m.sc.Finanzas>=88},
 {id:'crecer',g:'Medio',ic:'📈',n:'Rey del crecimiento',d:'Crecer 35% o más en ventas en un solo año',t:(s,m,h,ph)=>h&&ph&&h.sales>=ph.sales*1.35},
 {id:'innovar',g:'Difícil',ic:'💡',n:'Empresa innovadora',d:'Llegar a 65 de innovación',t:s=>s.inno>=65},
 {id:'mundo',g:'Medio',ic:'🌎',n:'Conquistador internacional',d:'Llevar la empresa a otro país',t:s=>!!s.flags.export},
 {id:'sobrevivir',g:'Medio',ic:'🛡️',n:'Superviviente',d:'Volver a tener utilidad después de un crédito de emergencia',t:(s,m,h)=>h&&s.over>0&&h.profit>0&&h.y>s.overY},
 {id:'sinDeuda',g:'Muy difícil',ic:'💳',n:'Libre de deudas',d:'Pagar toda la deuda después de haberte endeudado',t:(s,m,h)=>h&&s.hadDebt&&s.debt<1},
 {id:'fieles',g:'Difícil',ic:'😊',n:'Clientes fieles',d:'Llegar a 70 de satisfacción',t:s=>s.sat>=70},

function toast(html,cls=''){const box=$('toasts');if(!box)return;const el=document.createElement('div');el.className='toast '+cls;el.innerHTML=iconize(html);box.appendChild(el);setTimeout(()=>el.remove(),4200)}
function checkAch(closed){if(s.debt>1)s.hadDebt=1;const m=met(s),h=closed?s.hist[s.hist.length-1]:null,ph=closed?s.hist[s.hist.length-2]:null;
  for(const a of ACH)if(!s.ach[a.id]&&a.t(s,m,h,ph)){s.ach[a.id]=s.year;toast(`<b>${a.ic} ${ACC.profile&&ACC.profile.ach[a.id]?'Logro repetido':'Logro desbloqueado'}</b>${a.n}`,'ach')}}
const STYLES={G:['Crecimiento','Más tamaño y participación, con más deuda y riesgo','📈','🚀 Director de crecimiento','crecimiento'],C:['Conservadora','Estabilidad y liquidez, con menos expansión','🛡️','🛡️ Director prudente','conservador'],
 I:['Innovadora','Ventaja competitiva y valor futuro, con alto costo y riesgo de ejecución','💡','💡 Director innovador','innovador'],R:['Rentable','Margen y caja, sacrificando crecimiento','💰','💰 Director financiero','rentable']};
// El estilo combina lo que decidiste (60%) con lo que realmente construiste (40%): crecimiento y deuda, innovación, margen y precio, liquidez sin deuda.
function styleMix(){const d=s.style,n=Object.values(d).reduce((a,b)=>a+b,0);if(!n)return null;
  const m=met(s),h=s.hist[s.hist.length-1],sales=s.phase==='end'||s.phase==='year'?h.sales:m.sales,c1=x=>clamp(x,0,1);
  const o={G:c1((sales/s.S0-1)/1.5)+c1(m.dr/.6)*.5,I:c1(s.inno/70),R:c1(m.margin/.2)+c1((s.price/s.price0-1)/.3)*.3,C:c1(m.months/8)*(m.dr<.1?1:.3)+(m.dr<.05?.3:0)};
  const on=Object.values(o).reduce((a,b)=>a+b,0)||1,mix={};let t=0;
  for(const k in d){mix[k]=.6*d[k]/n+.4*o[k]/on;t+=mix[k]}for(const k in mix)mix[k]/=t;return mix}
function styleNow(){const m=styleMix();return m?Object.entries(m).sort((a,b)=>b[1]-a[1])[0][0]:null}
// si ningún estilo destaca (menos de 34% o a menos de 6 puntos del segundo), el título es equilibrado
function styleTitle(){const e=Object.entries(styleMix()).sort((a,b)=>b[1]-a[1]);return e[0][1]<.34||e[0][1]-e[1][1]<.06?'🧭 Director equilibrado':STYLES[e[0][0]][3]}
function styleText(){const m=styleMix();if(!m)return'';const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  if(e[0][1]<.34||e[0][1]-e[1][1]<.06)return `Repartiste tus decisiones entre varios estilos: ${STYLES[e[0][0]][4]} (${pct(e[0][1])}) y ${STYLES[e[1][0]][4]} (${pct(e[1][1])}) fueron los más marcados.`;
  return e[1][1]>=.25?`Tu estilo fue principalmente ${STYLES[e[0][0]][4]}, pero con una fuerte orientación ${e[1][0]==='G'?'al crecimiento':e[1][0]==='I'?'a la innovación':e[1][0]==='R'?'a la rentabilidad':'a la prudencia'}.`:`Tu estilo fue claramente ${STYLES[e[0][0]][4]}: ${STYLES[e[0][0]][1].toLowerCase()}.`}
const styleBars=()=>{const m=styleMix()||{G:0,C:0,I:0,R:0},top=styleNow();return `<div class="sty">${Object.entries(STYLES).map(([k,v])=>`<div class="${k===top?'on':''}" title="${v[1]}"><span>${v[2]} ${v[0]} ${m[k]?pct(m[k]):''}</span><s><i class="s${k}" style="width:${m[k]*100}%"></i></s></div>`).join('')}</div>`};
const STAGES=['Empresa pequeña','Empresa en crecimiento','Gran empresa'];
const stageName=()=>STAGES[stageOf()]+(s.flags.export?' con presencia internacional':'');
const stageOf=()=>{const r=(s.phase==='year'||s.phase==='end'?s.hist[s.hist.length-1].sales:met(s).sales)/s.S0;return r>=2.4?2:r>=1.4?1:0};
const BIZIC={delivery:'🛵',ecommerce:'📦',comida:'🍽️'};
function scene(){
  const m=met(s),st=stageOf(),intl=!!s.flags.export,crisis=s.bankrupt||m.risk>=55||s.cash<0,W=360,H=170,G=120,up=!crisis&&m.profit>0;
  const B=[[{x:150,w:58,h:44}],[{x:118,w:68,h:74},{x:192,w:48,h:46}],[{x:84,w:62,h:104},{x:152,w:58,h:80},{x:216,w:46,h:56}]][st].slice();
  if(s.flags.sucursal||s.flags.franquicia)B.push({x:274,w:40,h:38,two:1});
  let g=`<rect width="${W}" height="${H}" fill="var(${crisis?'--sky-bad':'--sky'})"/>`;
  // cielo: sol o tormenta
  if(crisis){g+=`<g fill="var(--cloud)"><ellipse cx="46" cy="30" rx="24" ry="12"/><ellipse cx="66" cy="24" rx="18" ry="12"/><ellipse cx="30" cy="26" rx="14" ry="9"/></g><path d="M50 40l-7 13h7l-4 12 12-16h-7l4-9z" fill="var(--win)"/>`;
    for(let i=0;i<6;i++)g+=`<line x1="${26+i*9}" y1="46" x2="${22+i*9}" y2="56" stroke="var(--cloud)" stroke-width="1.5"/>`}
  else{g+=`<circle cx="38" cy="30" r="11" fill="var(--sun)"/>`;for(let i=0;i<8;i++){const a=i*Math.PI/4;g+=`<line x1="${38+Math.cos(a)*15}" y1="${30+Math.sin(a)*15}" x2="${38+Math.cos(a)*20}" y2="${30+Math.sin(a)*20}" stroke="var(--sun)" stroke-width="2" stroke-linecap="round"/>`}
    g+=`<g fill="var(--cloud-l)"><ellipse cx="250" cy="22" rx="20" ry="7"/><ellipse cx="264" cy="18" rx="13" ry="7"/></g>`}
  // presencia internacional: globo, ruta y avión
  if(intl){g+=`<g fill="none" stroke="var(--blue)" stroke-width="1.6"><circle cx="328" cy="30" r="15" fill="var(--surface)"/><path d="M313 30h30M328 15c6 6 6 24 0 30M328 15c-6 6-6 24 0 30"/><path d="M${B[0].x+B[0].w/2} ${G-B[0].h-16}Q230 -6 312 26" stroke-dasharray="3 4"/></g><path d="M236 16l10-3-3 9-2-4z" fill="var(--blue)"/>`}
  g+=`<rect y="${G}" width="${W}" height="${H-G}" fill="var(${crisis?'--ground-bad':'--ground'})"/><rect y="${H-22}" width="${W}" height="22" fill="var(--road)"/>`;
  for(let x=8;x<W;x+=26)g+=`<rect x="${x}" y="${H-12}" width="12" height="2" fill="var(--road-l)"/>`;
  // edificios
  B.forEach((b,i)=>{g+=`<rect x="${b.x}" y="${G-b.h}" width="${b.w}" height="${b.h}" rx="3" fill="var(${b.two?'--bld2':'--bld'})"/>`;
    for(let yy=G-b.h+8;yy<G-14;yy+=14)for(let xx=b.x+7;xx<b.x+b.w-9;xx+=13)g+=`<rect x="${xx}" y="${yy}" width="7" height="8" rx="1" fill="var(${crisis&&(xx+yy)%3?'--win-off':'--win'})"/>`;
    g+=`<rect x="${b.x+b.w/2-5}" y="${G-12}" width="10" height="12" fill="var(--door)"/>`;
    if(i===0)g+=`<rect x="${b.x+8}" y="${G-b.h-14}" width="${b.w-16}" height="13" rx="3" fill="var(--sign)"/><text x="${b.x+b.w/2}" y="${G-b.h-4}" font-size="9" text-anchor="middle" style="fill:var(--on-sign);font-family:var(--body);font-weight:600">${(s.name||'').split(/\s+/).map(w=>w[0]||'').join('').slice(0,3).toUpperCase()}</text>`});
  // tablero de tendencia
  g+=`<g transform="translate(${B[0].x-34},${G-34})"><rect width="26" height="20" rx="3" fill="var(--surface)" stroke="var(--line)"/><polyline points="${up?'4,15 10,11 15,13 22,5':'4,5 10,9 15,7 22,15'}" fill="none" stroke="var(${up?'--good':'--bad'})" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="20" width="2" height="14" fill="var(--door)"/></g>`;
  // equipo
  const n=Math.min(16,Math.round(s.emp));for(let i=0;i<n;i++){const x=12+i*8+(i%2)*2,y=G+16+(i%3)*4;g+=`<circle cx="${x}" cy="${y-9}" r="3" fill="var(--person)"/><rect x="${x-3}" y="${y-6}" width="6" height="9" rx="2" fill="var(--person)"/>`}
  // actividad propia de cada negocio, crece con la empresa
  const k=(st+1)*(crisis?1:2);
  if(s.biz==='comida'){for(let i=0;i<Math.min(k,5);i++){const x=206+i*30;if(x>W-20)break;g+=`<path d="M${x-11} ${G+10}h22l-11-9z" fill="var(--bad)"/><rect x="${x-1}" y="${G+10}" width="2" height="12" fill="var(--door)"/><rect x="${x-8}" y="${G+18}" width="16" height="3" rx="1" fill="var(--surface)"/>`}}
  else if(s.biz==='ecommerce'){for(let i=0;i<Math.min(k,6);i++){const x=206+i*22;g+=`<rect x="${x}" y="${G+10}" width="14" height="12" rx="1.500" fill="var(--box)"/><path d="M${x} ${G+15}h14M${x+7} ${G+10}v12" stroke="var(--door)" stroke-width="1" fill="none"/>`;if(i%2)g+=`<rect x="${x+2}" y="${G}" width="10" height="10" rx="1.500" fill="var(--box)"/>`}}
  const vans=s.biz==='comida'?0:Math.min(s.biz==='delivery'?k:st+1,6);
  for(let i=0;i<vans;i++){const x=W-34-i*48;g+=`<rect x="${x}" y="${H-24}" width="20" height="11" rx="2" fill="var(--sign)"/><path d="M${x+20} ${H-20}h6l3 4v3h-9z" fill="var(--bld)"/><circle cx="${x+6}" cy="${H-12}" r="3" fill="var(--door)"/><circle cx="${x+22}" cy="${H-12}" r="3" fill="var(--door)"/>`}
  return `<svg class="scene" viewBox="0 0 ${W} ${H}" role="img" aria-label="${STAGES[st]}${intl?', con presencia internacional':''}${crisis?', en crisis':''}">${g}</svg>`;
}

const AREAIC={'Precios':'🏷️','Marketing':'📣','Flujo de caja':'💧','Contratación':'🧑‍💼','Compras':'🛒','Finanzas':'💰','Ventas':'📈','Endeudamiento':'🏦','Inventarios':'📦','Capacitación':'🎓','Clientes':'👥','Competencia':'⚔️','Reducción de costos':'✂️','Apertura de sucursales':'🏬','Nuevos productos':'🧪','Tecnología':'💻','Gestión de riesgos':'🛡️','Recursos humanos':'🤝','Publicidad':'📺','Expansión':'🌎','Inversiones':'🏗️','Producción':'🏭','Contratación y despidos':'🧑‍💼','Innovación':'💡'};
const EVIC={crisis:'📉',proveedor:'🚚',competidor:'⚔️',reputacion:'📱',falla:'🔧',huelga:'✊',impuestos:'🧾',tecno:'🤖',boom:'🚀',angel:'🤝',remate:'🏷️',bloqueo:'🚧',clienteClave:'💔'};
function optIcon(o){const e=o.e||{};return e.own<0?'🤝':e.debt>0?'🏦':e.pay||e.debt<0?'💳':e.inno>=5?'💡':e.empP<0?'✂️':e.emp>0?'🧑‍💼':e.cap>=.2?'🏭':o.mk?'📣':e.price>0?'📈':e.price<0?'🏷️':e.vc<0?'📦':e.fixed<0?'✂️':e.cust>0||e.g>0?'👥':e.sat>0||e.rep>0?'⭐':e.prod>0?'⚙️':e.cash>0?'💵':e.cash<0?'💰':o.alt?'🎲':'⏸️'}
function optChips(o){const e=eff(o).e,c=[],a=(k,up,l)=>{const v=e[k];if(v)c.push(((v>0)===up?'↑ ':'↓ ')+l)};
  a('cash',true,'Caja');if(e.debt>0)c.push('↑ Deuda');if(e.debt<0||e.pay)c.push('↓ Deuda');a('cust',true,'Clientes');a('g',true,'Crecimiento');a('price',true,'Precio');a('vc',true,'Costo por unidad');a('fixed',true,'Gastos fijos');
  if(e.cap||e.upe)c.push(((e.cap||e.upe)>0?'↑ ':'↓ ')+'Capacidad');if(e.emp||e.empP)c.push(((e.emp||e.empP)>0?'↑ ':'↓ ')+'Personal');a('rep',true,'Reputación');a('sat',true,'Satisfacción');a('prod',true,'Productividad');a('inno',true,'Innovación');
  if(e.own<0)c.push('↓ Tu parte de la empresa');a('rate',true,'Tasa de interés');return c}

const rowsHTML=r=>r.length?`<ul class="deltas">${r.map((x,i)=>`<li style="animation-delay:${i*60}ms"><span>${x.l}</span><b class="${x.cls}">${x.txt}</b></li>`).join('')}</ul>`:'<p class="note">Ningún indicador cambió.</p>';
function stageHTML(){
  if(s.phase==='intro')return introHTML();if(s.phase==='dec')return decHTML();if(s.phase==='res')return resHTML();if(s.phase==='year')return yearHTML();return endHTML();

function situation(){const m=met(s);
  if(s.cash<0)return['⛈️','La caja está en rojo. Si cierras el año así tendrás que cubrirla con crédito caro.','bad'];
  if(m.dr>.4)return['🏦','La deuda pesa: buena parte de lo que ganes este año irá al banco.','warn'];
  if(m.profit<0)return['📉','Con los números actuales, este año cerraría con pérdida. Necesitas vender más o gastar menos.','bad'];
  if(m.demand>m.capE*1.02)return['🏭',m.staffShort?'Hay más demanda de la que tu equipo puede atender. Te falta personal.':'La demanda supera tu capacidad. Si no la amplías, perderás ventas y clientes.','warn'];
  if(m.months>6)return['💰','Tienes caja de sobra. La pregunta de este año es en qué usarla.','good'];
  if(s.sat<45)return['😟','Tus clientes no están contentos. Antes de crecer conviene arreglar el servicio.','warn'];
  return['📈','La empresa está en marcha. Este año se trata de crecer sin descuidar la caja.','good']}
function introHTML(){const L=LEVELS[s.year],b=BIZ[s.biz],[ic,tx,cl]=situation();

  <div class="impact i-${cl}"><b>${ic} Situación actual.</b> ${tx}</div>

function decHTML(){const d=s.queue[s.qi],g=GL[d.c],good=d.good;

function resHTML(){const L=s.last,cls=Math.abs(L.di)<.3?'neu':L.di>0?'up':'down',fy=[...new Set(L.future)].map(y=>s.year+y).filter(y=>y<=5);
  return `<div class="card plain"><div class="banner ${cls==='up'?'b-green':cls==='down'?'b-red':'b-blue'}"><span class="big">${cls==='up'?'📈':cls==='down'?'📉':'➖'}</span><div><span class="hud-k">Decisión tomada · ${L.d.a}</span><h3>${L.label}</h3></div></div>

  ${L.notes.map(n=>`<div class="impact i-warn">${n}</div>`).join('')}
  <div><div class="eyebrow" style="margin-bottom:6px">Impacto</div>${rowsHTML(L.rows)}</div>

const _newGame=newGame,_choose=choose,_closeYear=closeYear,_nextYear=nextYear,_render=render;
newGame=function(){
  for(const g of ACC.games)if(g.status==='en_curso'){g.status='abandonada';g.updated=iso()} // el servidor hace lo mismo al guardar la nueva
  ACC.cur={id:'g'+Date.now().toString(36)+Math.floor(rnd()*1e6).toString(36),status:'en_curso',started:iso()};ACC.view='game';_newGame();persist()};
choose=function(k){const d=s.queue[s.qi],pre=s.pre?s.pre.t:null,b=s.prev||snap(s);_choose(k);
  const L=s.log[s.log.length-1],a=snap(s),pk=o=>({cash:Math.round(o.cash),debt:Math.round(o.debt),cust:Math.round(o.cust),sales:Math.round(o.sales),profit:Math.round(o.profit),index:+o.index.toFixed(1)});
  L.n=s.log.filter(x=>!x.yr).length;L.sit=T(d.ev?d.a+': '+d.s:d.s);L.opt='ABCD'[k];L.before=pk(b);L.after=pk(a);if(pre)L.pre=pre;L.notes=s.last.notes;persist()};
closeYear=function(){_closeYear();persist()};
nextYear=function(){_nextYear();if(s&&s.phase==='end'&&ACC.cur&&ACC.cur.status==='en_curso'){ACC.cur.status='completada';ACC.cur.completed=iso();ACC.cur.result=finalResult();
    if(ACC.profile)for(const id in s.ach)if(!ACC.profile.ach[id])ACC.profile.ach[id]=iso()}
  persist()};
async function resume(id){const r=await api('GET','/api/games/'+id);if(!r.ok){toast('<b>No se pudo abrir esa partida</b>'+esc(r.data.error||''));return}const g=r.data.game;
  try{s=restore(g.state)}catch(e){toast('<b>No se pudo abrir esa partida</b>Empieza una nueva.');return}
  for(const o of ACC.games)if(o.id!==id&&o.status==='en_curso')o.status='abandonada';
  if(g.status==='abandonada'&&g.phase!=='end')g.status='en_curso';ACC.cur={id:g.id,status:g.status,started:g.started,completed:g.completed,result:g.result};ACC.view='game';render();if(g.status==='en_curso')persist()}

async function submitAuth(form){const A=ACC.auth;if(A.busy)return;const d=Object.fromEntries(new FormData(form).entries()),reg=A.mode==='register';
  const err=m=>{A.err=m;A.busy=false;const e=$('autherr');if(e){e.textContent=m;e.hidden=false}const b=form.querySelector('button[type=submit]');if(b){b.disabled=false;b.textContent=reg?'Crear cuenta':'Entrar'}};
  if(reg){if(!d.name.trim()||!d.username.trim()||!d.email.trim()||!d.password||!d.password2)return err('Completa todos los campos.');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email.trim()))return err('Introduce un correo electrónico válido.');
    if(d.password.length<8)return err('Contraseña demasiado corta: usa al menos 8 caracteres.');if(d.password!==d.password2)return err('Las contraseñas no coinciden.')}
  else if(!d.ident.trim()||!d.password)return err('Escribe tu usuario o correo y tu contraseña.');
  A.busy=true;const b=form.querySelector('button[type=submit]');b.disabled=true;b.textContent='Un momento…';
  const r=await api('POST',reg?'/api/register':'/api/login',reg?d:{id:d.ident,password:d.password});if(!r.ok)return err(r.data.error||'Ocurrió un problema. Intenta de nuevo.');

  if(s&&ACC.cur){ACC.view='game';render();persist()}else{ACC.view='home';render()}}

  if(v==='home'||v==='game'){_render();const st=$('app').firstElementChild;
    if(!s){const c=ACC.me?resumeCard():guestCard();if(c&&st)st.insertAdjacentHTML('afterbegin',iconize(c))}
    else{if(ACC.canSave){const h=document.querySelector('.hud-r');if(h&&!$('saved'))h.insertAdjacentHTML('beforeend','<span id="saved" class="saved" aria-live="polite">Partida guardada</span>')}
      if(!ACC.me&&s.phase==='end'){const c=document.querySelector('#stage .card');if(c)c.insertAdjacentHTML('beforebegin',saveCard())}}
    acctBar();return}
  $('title').textContent='Simulador de Negocios';$('eyebrow').textContent=v==='auth'?'Juego de gestión empresarial':'Tu cuenta';
  const html=v==='auth'?authHTML():v==='profile'?profileHTML():v==='games'?gamesHTML():v==='detail'?detailHTML(ACC.detail.g,ACC.detail.back):adminHTML();
  $('app').innerHTML=iconize(html);acctBar()};
async function openDetail(url,back){ACC.detail={g:null,back};ACC.view='detail';render();window.scrollTo(0,0);const r=await api('GET',url);if(r.ok){ACC.detail.g=r.data.game;render()}else{ACC.view=back;render();toast('<b>No se pudo abrir esa partida</b>'+esc(r.data.error||''))}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-pact]');if(!t)return;const a=t.dataset.pact,k=t.dataset.k;
  if(a==='auth'){ACC.auth={mode:k,err:'',busy:false};ACC.view='auth';render();window.scrollTo(0,0);const i=document.querySelector('#authform input');if(i)i.focus()}
  else if(a==='logout')logout();
  else if(a==='view'){if(k==='home'&&s&&s.phase==='end'&&ACC.me)s=null;if(k==='admin'){ACC.view='admin';loadAdmin();return}ACC.view=k==='game'&&!s?'home':k;if(k==='home'&&s)ACC.view='game';render();window.scrollTo(0,0)}
  else if(a==='resume')resume(k);
  else if(a==='detail')openDetail('/api/games/'+k,'games');
  else if(a==='auser'){ACC.admin.sel=k;render()}
  else if(a==='adetail')openDetail('/api/admin/games/'+k.split('|')[1],'admin')});
document.addEventListener('submit',e=>{if(e.target.matches&&e.target.matches('form.authform')){e.preventDefault();submitAuth(e.target)}});
render();boot();
</script>
</body>
